<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Lista de Clientes</h1>
<nav>
    <a class="botao" href="/">Página Inicial</a>
    <a class="botao" href="/cliente">Lista Clientes</a>
    <a class="botao" href="/tarefas/remedio">Lista Remédios</a>
</nav>
<br>

<form action="/cliente/enviar" method="POST">

    <label>Nome</label>
    <input type="text" name="nome" maxlength="100" required>

    <label>Telefone</label>
    <input type="text" name="telefone" required>

    <label>Idade</label>
    <input type="number" name="idade" required>

    <label>Data de Cadastro</label>
    <input type="date" name="data_cadastro" required>

    <button type="submit">Adicionar Cliente</button>

</form>

<table>
    <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Telefone</th>
        <th>Idade</th>
        <th>Data de Cadastro</th>
        <th>Ações</th>
    </tr>
{% for cliente in clientes %}
<tr>
    <td>{{ cliente[0] }}</td>
    <td>{{ cliente[1] }}</td>
    <td>{{ cliente[2] }}</td>
    <td>{{ cliente[3] }}</td>
    <td>{{ cliente[4] }}</td>

    <td class="acoes">
        <a class="botao editar" href="/cliente/editar/{{ cliente[0] }}">Editar</a>

        <form action="/cliente/excluir/{{ cliente[0] }}" method="POST">
            <button type="submit">Excluir</button>
        </form>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="6">Nenhum cliente cadastrado.</td>
</tr>
{% endfor %}
</table>

</body>
</html>
